# Production stack — bound to localhost only; HestiaCP's Nginx reverse-proxies
# the public domain to these ports. Values come from a git-ignored root .env
# (see .env.prod.example). Run:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# NOTE: the Next.js frontend is NO LONGER in Docker. It runs on the host via
# pm2 (see ecosystem.config.js + scripts/deploy-frontend.sh) so frontend
# deploys are gate-free and build-before-restart. Nginx proxies "/" to the
# host Next.js on 127.0.0.1:3001 and the API paths to this backend container.
# Only db + backend remain containerized (and still go through the merge gate).

services:
  db:
    image: mariadb:10.11
    container_name: limo-prod-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: limo-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_COLLECTSTATIC: "1"
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - media_data:/app/media
    ports:
      # Host port is configurable so the stack can coexist with anything already
      # on 8000 (e.g. a prior non-Docker deploy). Nginx proxies to this port.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

volumes:
  db_data:
  media_data:
