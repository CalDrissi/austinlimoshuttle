# Production stack — bound to localhost only; HestiaCP's Nginx reverse-proxies
# the public domain to these ports. Values come from a git-ignored root .env
# (see .env.prod.example).
#
# NOTE: ONLY MariaDB still runs in Docker. Both app processes run on the host
# under pm2 (see ecosystem.config.js) with gate-free fast-lane deploy scripts:
# frontend → scripts/deploy-frontend.sh, backend → scripts/deploy-backend.sh.
# The db is published to the host loopback via docker-compose.db-hostport.yml;
# bring it up with BOTH files (never the base file alone, which would drop the
# port mapping the host backend depends on):
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.db-hostport.yml up -d db
#
# The backend service below is KEPT ONLY AS A ROLLBACK ARTIFACT: the stopped
# limo-prod-backend container + image can be `docker start`ed to restore the
# old containerized backend on :8001 if the host lane fails (stop the pm2
# limo-backend app first — both bind 127.0.0.1:8001).

services:
  db:
    image: mariadb:10.11
    container_name: limo-prod-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: limo-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_COLLECTSTATIC: "1"
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - media_data:/app/media
    ports:
      # Host port is configurable so the stack can coexist with anything already
      # on 8000 (e.g. a prior non-Docker deploy). Nginx proxies to this port.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"

volumes:
  db_data:
  media_data:
