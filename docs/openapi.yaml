openapi: 3.0.3
info:
  title: Austin Limo Shuttle API
  version: 1.0.0
  description: |-
    Booking, quoting and payment API.

    **Fares are computed server-side and cannot be supplied by a client.** Request a quote to receive a signed, short-lived `quote_token`, then present that token when creating a booking; the server re-measures the journey and recomputes the fare before anything is stored. No endpoint accepts a price or a distance.

    Authentication is session-based. Sign in via `/api/auth/login/`; the session cookie authorises subsequent requests. State-changing requests require the CSRF token from the `csrftoken` cookie in an `X-CSRFToken` header.
paths:
  /api/pages/:
    get:
      operationId: pages_list
      description: Every published page. Use this to build navigation and a sitemap.
      summary: List published pages
      tags:
      - content
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Page'
          description: ''
  /api/pages/{slug}/:
    get:
      operationId: pages_retrieve
      description: Content and SEO metadata for a CMS page. Unpublished pages 404.
      summary: Fetch one published page
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: URL slug, e.g. "fleet".
        required: true
      tags:
      - content
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/vehicles/:
    get:
      operationId: vehicles_list
      description: Active vehicles only. Per-mile rates are not exposed — fares come
        from the quote endpoint so they cannot be recomputed (or disputed) client-side.
      summary: List bookable vehicles
      tags:
      - content
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
          description: ''
  /api/site-settings/:
    get:
      operationId: site_settings_retrieve
      description: What the header and footer display. Staff edit these in the admin,
        so a changed phone number does not need a deploy.
      summary: Site-wide contact details and social links
      tags:
      - content
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
          description: ''
  /api/availability/:
    get:
      operationId: availability_retrieve
      description: For the date picker, so a customer can see before choosing that
        a late-night pickup or an event date costs more.
      summary: Surcharge windows and blackout dates
      tags:
      - content
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
          description: ''
  /api/quotes/:
    post:
      operationId: quotes_create
      description: |-
        Measures the journey server-side from the two addresses and returns a fare per bookable vehicle.

        **There is no `distance_miles` field and no price field.** A client cannot declare either. Each result carries a signed `quote_token` — present it to `POST /api/bookings/` and the fare is recomputed before anything is stored.

        Supply `dropoff_address` for a transfer, or `hours` for hourly hire, never both. Throttled to 30/hour.
      summary: Price a journey across every vehicle
      tags:
      - quotes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
            examples:
              AirportTransfer:
                value:
                  pickup_address: Austin-Bergstrom International Airport
                  dropoff_address: Downtown Austin, TX
                  pickup_at: '2026-09-01T14:30:00-05:00'
                  meet_and_greet: true
                summary: Airport transfer
              HourlyHire:
                value:
                  pickup_address: Downtown Austin, TX
                  pickup_at: '2026-09-01T19:00:00-05:00'
                  hours: '3'
                summary: Hourly hire
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/bookings/:
    post:
      operationId: bookings_create
      description: |-
        Redeems a `quote_token` and creates a booking in `pending` status. The fare is recomputed from the token; any amount in the request body is ignored because no such field exists.

        Sign in first, or supply `guest_email` for guest checkout. Take payment next via `POST /api/payments/intent/`.
      summary: Create a booking from a signed quote
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/bookings/{reference}/status/:
    get:
      operationId: bookings_status_retrieve
      description: |-
        Whether a booking has been confirmed, for the page shown after payment.

        Card payments are confirmed by Stripe's webhook, not by the browser, so the confirmation page polls this until the status turns `confirmed`.

        Reachable without a session because guest checkout has no session: the reference is the capability, exactly as it is for `/api/payments/intent/`. The response is therefore limited to what the holder of the reference already knows — no addresses, no passenger details. An unknown reference returns 404.
      summary: Confirmation status for one booking
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatus'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/bookings/{reference}/receipt/:
    get:
      operationId: bookings_receipt_retrieve
      description: The confirmation as a PDF, rendered from the same template as the
        confirmation email. Reachable by reference (guest checkout has no session);
        a signed-in customer may only fetch their own.
      summary: Download the booking receipt (PDF)
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: application/pdf
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/bookings/{reference}/pay-cash/:
    post:
      operationId: bookings_pay_cash_create
      description: |-
        Confirms a pending booking without an online payment — the fare is collected by the driver. Records an awaiting-collection cash payment for the booking's own amount (never a client-supplied one) and moves the booking to `confirmed`. The payment only becomes `succeeded` when staff mark the cash collected in the back office, so paid-to-date reflects money actually received.

        Scoped like the other reference endpoints: a signed-in customer may only settle their own booking; a guest booking is settled by whoever holds the reference.
      summary: Confirm a booking for cash / pay-on-arrival
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatus'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Already paid, or the booking was cancelled.
  /api/account/bookings/:
    get:
      operationId: account_bookings_list
      summary: The signed-in customer's bookings
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/bookings/{reference}/:
    patch:
      operationId: account_bookings_partial_update
      description: |-
        Scoped to the signed-in customer. Another customer's reference returns **404, not 403** — a 403 would confirm the reference exists and allow bookings to be enumerated.

        `PATCH {"action": "cancel"}` cancels, if the pickup is still in the future.
      summary: Read or cancel one of your bookings
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCancelBookingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCancelBookingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCancelBookingRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    get:
      operationId: account_bookings_retrieve
      description: |-
        Scoped to the signed-in customer. Another customer's reference returns **404, not 403** — a 403 would confirm the reference exists and allow bookings to be enumerated.

        `PATCH {"action": "cancel"}` cancels, if the pickup is still in the future.
      summary: Read or cancel one of your bookings
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/bookings/{reference}/amend-request/:
    post:
      operationId: account_bookings_amend_request_create
      description: |-
        Owner-only. Unlike a direct amend, this does **not** change the booking: it files a pending request that staff review. The pickup/drop-off addresses and vehicle stay office-only; changing the pickup time re-prices and the new fare is returned on the request.

        Rejected (400) when the pickup is already inside the office-set amendment window, when the booking is cancelled/completed, or when a request is already awaiting review.
      summary: Request a change to one of your bookings (staff must approve)
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingAmendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingAmendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingAmendRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAmendmentRequest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/bookings/{reference}/cancel-request/:
    post:
      operationId: account_bookings_cancel_request_create
      description: |-
        Owner-only. Unlike the direct `PATCH {action: cancel}`, this does **not** cancel the booking: it files a pending cancellation request that staff review. Approval cancels the booking and issues a staff-set refund; the refund is **not** automatic.

        Rejected (400) when the pickup is already inside the office-set cancellation window, when the booking is cancelled/completed, or when a cancellation request is already awaiting review.
      summary: Request to cancel one of your bookings (staff must approve)
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - bookings
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCancellationRequest'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/profile/:
    patch:
      operationId: account_profile_partial_update
      description: Self-service edit of first_name, last_name, email and phone. Email
        must be a valid address and unique across accounts; it is also the sign-in
        identity, so a change updates how you log in.
      summary: Update the signed-in customer's profile
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/cards/:
    post:
      operationId: account_cards_create
      description: GET lists the cards. POST records a card the customer just added
        with a SetupIntent -- the body carries the Stripe PaymentMethod id; the card
        itself stays at Stripe.
      summary: List or add the signed-in customer's cards on file
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCardRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedCard'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedCard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    get:
      operationId: account_cards_list
      description: GET lists the cards. POST records a card the customer just added
        with a SetupIntent -- the body carries the Stripe PaymentMethod id; the card
        itself stays at Stripe.
      summary: List or add the signed-in customer's cards on file
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedCard'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedCard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/cards/setup-intent/:
    post:
      operationId: account_cards_setup_intent_create
      description: Returns a SetupIntent client secret and the publishable key so
        the browser can confirm a new card with Stripe Elements. No charge is made;
        the card is kept on file for future use.
      summary: Start adding a card (Stripe SetupIntent)
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupIntentResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/cards/{id}/:
    delete:
      operationId: account_cards_destroy
      summary: Remove a card on file
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/account/cards/{id}/default/:
    post:
      operationId: account_cards_default_create
      summary: Set a saved card as the default
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedCard'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/staff/amendment-requests/:
    get:
      operationId: staff_amendment_requests_list
      description: Staff-only. Defaults to the pending queue; pass `?status=approved|declined|all`
        to widen it.
      summary: List booking change requests (staff)
      parameters:
      - in: query
        name: status
        schema:
          type: string
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingAmendmentRequest'
          description: ''
  /api/staff/amendment-requests/{id}/approve/:
    post:
      operationId: staff_amendment_requests_approve_create
      description: 'Staff-only. Applies the requested change to the booking, re-prices,
        marks the request approved and emails the customer. Idempotent: a request
        that is already approved or declined returns **409**.'
      summary: Approve a booking change request (staff)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        required: true
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAmendmentRequest'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/staff/amendment-requests/{id}/decline/:
    post:
      operationId: staff_amendment_requests_decline_create
      description: 'Staff-only. Marks the request declined (the booking is untouched)
        and emails the customer with the reason. Idempotent: an already-resolved request
        returns **409**.'
      summary: Decline a booking change request (staff)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        required: true
      tags:
      - staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DetailRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingAmendmentRequest'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the `csrftoken` cookie so the SPA can echo it in an `X-CSRFToken`
        header on authenticated writes. Safe to call anonymously and as often as needed.
      summary: Prime the CSRF cookie
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Sets a session cookie. A wrong password and an unknown address
        return the identical response, so this cannot be used to discover who has
        an account.
      summary: Sign in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Sign out
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Password strength is enforced. Registering an address that already
        exists returns **202 with a neutral message** rather than an error, for the
        same anti-enumeration reason as sign-in.
      summary: Create an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Always returns 202, whether or not the address is registered.

        The reset is completed on Django-served pages under `/accounts/`, not in the frontend. Note that customers migrated from the previous system have no password at all until they use this.
      summary: Request a password reset link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/send-code/:
    post:
      operationId: auth_send_code_create
      description: |-
        Passwordless sign-in, step one. Emails a six-digit code that is valid for ten minutes, single-use, and rate-limited per address and per IP.

        **Always returns 200** with a neutral message, whether or not the address is registered -- the response cannot be used to discover who has an account, exactly like password reset. A registered customer is sent a code; nothing happens for anyone else.
      summary: Email a one-time sign-in code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendCodeRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/verify-code/:
    post:
      operationId: auth_verify_code_create
      description: Passwordless sign-in, step two. Exchanges a valid, unexpired, unused
        code for a session -- the response and cookie are identical to `/auth/login/`.
        A wrong, expired, used or over-attempted code returns **400** with a single
        neutral message. A correct code is consumed on use and cannot be replayed.
      summary: Sign in with a one-time code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/me/:
    patch:
      operationId: auth_me_partial_update
      description: GET returns the current profile, or **204** with no body for an
        anonymous visitor — every storefront page asks "who am I?" on load, and an
        error status would land in the browser console as noise. PATCH updates the
        editable fields (first_name, last_name, phone) and requires a session. Email
        is the login identifier and is not editable here.
      summary: Read or update the signed-in customer
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    get:
      operationId: auth_me_retrieve
      description: GET returns the current profile, or **204** with no body for an
        anonymous visitor — every storefront page asks "who am I?" on load, and an
        error status would land in the browser console as noise. PATCH updates the
        editable fields (first_name, last_name, phone) and requires a session. Email
        is the login identifier and is not editable here.
      summary: Read or update the signed-in customer
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '204':
          description: No response body
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/payments/config/:
    get:
      operationId: payments_config_retrieve
      description: What the browser needs to render Stripe Elements. Only the publishable
        key is ever exposed; it is designed to be public.
      summary: Publishable key and payment availability
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfig'
          description: ''
  /api/payments/intent/:
    post:
      operationId: payments_intent_create
      description: |-
        Creates a Stripe PaymentIntent and returns its client secret for Stripe Elements.

        The amount comes from the booking, which the pricing engine computed. Nothing in the request body influences it.

        **Confirmation happens by webhook, not here.** A successful card confirmation in the browser does not mark the booking paid — Stripe calls `/api/payments/webhook/` and that is what confirms it. Poll `/api/account/bookings/{reference}/` or show a pending state.
      summary: Start payment for a booking
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Already paid, or the booking was cancelled.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Card payments are not configured.
  /api/payments/webhook/:
    post:
      operationId: payments_webhook_create
      description: |-
        Called by Stripe, never by the frontend. Requests are authenticated by HMAC signature over the raw body; unsigned requests are refused.

        Idempotent: every processed event id is recorded, so Stripe's retries cannot double-confirm a booking or double-record a refund.
      summary: Stripe webhook (not for frontend use)
      tags:
      - payments
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/enquiries/:
    post:
      operationId: enquiries_create
      description: Throttled to 10/hour per address.
      summary: Submit the contact form
      tags:
      - enquiries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnquiryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnquiryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnquiryRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
  schemas:
    ActionEnum:
      enum:
      - cancel
      type: string
      description: '* `cancel` - cancel'
    AddCardRequest:
      type: object
      description: The PaymentMethod id the browser produced after confirming a SetupIntent.
      properties:
        payment_method_id:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - payment_method_id
    Availability:
      type: object
      description: Everything a date picker needs to warn about surcharged times.
      properties:
        blackout_dates:
          type: array
          items:
            $ref: '#/components/schemas/BlackoutDate'
        time_surcharges:
          type: array
          items:
            $ref: '#/components/schemas/TimeSurcharge'
      required:
      - blackout_dates
      - time_surcharges
    BlackoutDate:
      type: object
      properties:
        date:
          type: string
          format: date
        name:
          type: string
        percentage:
          type: string
      required:
      - date
      - name
      - percentage
    Booking:
      type: object
      properties:
        reference:
          type: string
          readOnly: true
          description: Customer-facing booking code.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        trip_type:
          allOf:
          - $ref: '#/components/schemas/TripTypeEnum'
          readOnly: true
        pickup_address:
          type: string
          readOnly: true
        dropoff_address:
          type: string
          readOnly: true
        pickup_at:
          type: string
          format: date-time
          readOnly: true
        distance_miles:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
          description: From the Distance Matrix API. Null for hourly hire.
        duration_minutes:
          type: integer
          readOnly: true
          nullable: true
        hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Booked hours, for hourly hire.
        passenger_count:
          type: integer
          readOnly: true
        luggage_count:
          type: integer
          readOnly: true
        flight_number:
          type: string
          readOnly: true
        pickup_sign:
          type: string
          readOnly: true
          description: Name shown on the placard.
        meet_and_greet:
          type: boolean
          readOnly: true
        notes:
          type: string
          readOnly: true
          description: Customer instructions.
        vehicle_name:
          type: string
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        surcharge_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        price_lines:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_amendable:
          type: boolean
          readOnly: true
        amendment_deadline:
          type: string
          format: date-time
          readOnly: true
        pending_amendment:
          allOf:
          - $ref: '#/components/schemas/BookingAmendmentRequest'
          nullable: true
          readOnly: true
        last_amendment:
          allOf:
          - $ref: '#/components/schemas/BookingAmendmentRequest'
          nullable: true
          readOnly: true
        pending_cancellation:
          allOf:
          - $ref: '#/components/schemas/BookingCancellationRequest'
          nullable: true
          readOnly: true
        last_cancellation:
          allOf:
          - $ref: '#/components/schemas/BookingCancellationRequest'
          nullable: true
          readOnly: true
      required:
      - amendment_deadline
      - created_at
      - currency
      - distance_miles
      - dropoff_address
      - duration_minutes
      - flight_number
      - hours
      - is_amendable
      - last_amendment
      - last_cancellation
      - luggage_count
      - meet_and_greet
      - notes
      - passenger_count
      - pending_amendment
      - pending_cancellation
      - pickup_address
      - pickup_at
      - pickup_sign
      - price_lines
      - reference
      - status
      - status_display
      - subtotal
      - surcharge_total
      - tax
      - total
      - trip_type
      - vehicle_name
    BookingAmendRequest:
      type: object
      description: |-
        Customer-editable booking details within the office-set amendment window.

        All optional (a partial update). Most fields don't touch the fare; changing
        `pickup_at` does (night/event surcharges are time-based), so the server
        re-prices on a date change. The pickup/drop-off addresses and vehicle stay
        office-only — changing them is effectively a new trip. `phone` updates the
        account's contact number.
      properties:
        passenger_count:
          type: integer
          maximum: 20
          minimum: 1
        luggage_count:
          type: integer
          maximum: 20
          minimum: 0
        flight_number:
          type: string
          maxLength: 32
        pickup_sign:
          type: string
          maxLength: 120
        notes:
          type: string
        phone:
          type: string
          maxLength: 32
        pickup_at:
          type: string
          format: date-time
    BookingAmendmentRequest:
      type: object
      description: |-
        A customer's proposed change to a booking, awaiting (or past) staff review.

        Read-only: the client never writes this shape directly -- it POSTs the fields
        to amend (via `BookingAmendSerializer`) and receives this back. `changes` is
        the resolved OLD -> NEW diff; the `new_*` figures are the fare the change
        would produce (authoritative once approved).
      properties:
        id:
          type: integer
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        status_display:
          type: string
          readOnly: true
        requested_changes:
          readOnly: true
          description: 'Proposed {field: new_value}. Only changed fields appear.'
        changes:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        old_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        new_subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        new_surcharge_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        new_tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        new_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
        price_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: string
          format: email
          readOnly: true
        decline_reason:
          type: string
          readOnly: true
      required:
      - booking_reference
      - changes
      - currency
      - decline_reason
      - id
      - new_subtotal
      - new_surcharge_total
      - new_tax
      - new_total
      - old_total
      - price_delta
      - requested_at
      - requested_changes
      - reviewed_at
      - reviewed_by
      - status
      - status_display
    BookingCancellationRequest:
      type: object
      description: |-
        A customer's request to cancel a booking, awaiting (or past) staff review.

        Read-only: the client POSTs nothing but the request itself (no body) and
        receives this back. `paid_amount` is what had been paid when they asked;
        `refund_amount` is null until staff approve and set it (0 is a real value,
        not "unset").
      properties:
        id:
          type: integer
          readOnly: true
        booking_reference:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        status_display:
          type: string
          readOnly: true
        paid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Amount paid at request time; the default and ceiling for the
            refund.
        refund_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          description: Refund set by staff at approval. 0 is allowed; null until reviewed.
        currency:
          type: string
          readOnly: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: string
          format: email
          readOnly: true
        decline_reason:
          type: string
          readOnly: true
      required:
      - booking_reference
      - currency
      - decline_reason
      - id
      - paid_amount
      - refund_amount
      - requested_at
      - reviewed_at
      - reviewed_by
      - status
      - status_display
    BookingCreateRequest:
      type: object
      description: |-
        Create a booking from a signed quote token.

        Deliberately has no `total`, `subtotal` or any other money field: the server
        recomputes the fare from the token. A client-supplied amount is not merely
        ignored here, it is impossible to express.
      properties:
        quote_token:
          type: string
          minLength: 1
        passenger_count:
          type: integer
          maximum: 20
          minimum: 1
          default: 1
        luggage_count:
          type: integer
          maximum: 20
          minimum: 0
          default: 0
        flight_number:
          type: string
          maxLength: 32
        pickup_sign:
          type: string
          maxLength: 120
        notes:
          type: string
        guest_email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        guest_name:
          type: string
          maxLength: 150
        guest_phone:
          type: string
          maxLength: 32
      required:
      - quote_token
    BookingStatus:
      type: object
      description: |-
        The minimum a confirmation page needs.

        Deliberately narrow. This is the one booking endpoint reachable without a
        session, so it carries no addresses, no passenger names and no notes --
        only what someone holding the reference already knows.
      properties:
        reference:
          type: string
          readOnly: true
          description: Customer-facing booking code.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        pickup_at:
          type: string
          format: date-time
          readOnly: true
        vehicle_name:
          type: string
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          readOnly: true
      required:
      - currency
      - pickup_at
      - reference
      - status
      - status_display
      - total
      - vehicle_name
    Detail:
      type: object
      description: A human-readable message. Used for errors and simple acknowledgements.
      properties:
        detail:
          type: string
      required:
      - detail
    DetailRequest:
      type: object
      description: A human-readable message. Used for errors and simple acknowledgements.
      properties:
        detail:
          type: string
          minLength: 1
      required:
      - detail
    EnquiryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        nature:
          $ref: '#/components/schemas/NatureEnum'
        subject:
          type: string
          maxLength: 255
        message:
          type: string
          minLength: 1
        company_name:
          type: string
          description: Corporate enquiries only.
          maxLength: 255
      required:
      - email
      - message
      - name
    Journey:
      type: object
      description: The route as measured server-side. Null for hourly hire.
      properties:
        distance_miles:
          type: string
          description: Decimal string, e.g. "25.000".
        duration_minutes:
          type: integer
        pickup_address:
          type: string
          description: As resolved by the mapping service.
        dropoff_address:
          type: string
      required:
      - distance_miles
      - dropoff_address
      - duration_minutes
      - pickup_address
    KindEnum:
      enum:
      - base
      - band
      - surcharge
      - meet_greet
      - minimum_adjustment
      - tax
      type: string
      description: |-
        * `base` - base
        * `band` - band
        * `surcharge` - surcharge
        * `meet_greet` - meet_greet
        * `minimum_adjustment` - minimum_adjustment
        * `tax` - tax
    LoginRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    NatureEnum:
      enum:
      - general
      - service
      - corporate
      type: string
      description: |-
        * `general` - General enquiry
        * `service` - Service enquiry
        * `corporate` - Corporate account
    Page:
      type: object
      properties:
        slug:
          type: string
          description: URL path. Changing this breaks search rankings — don't.
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        url:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        page_type:
          $ref: '#/components/schemas/PageTypeEnum'
        body:
          type: string
        meta_title:
          type: string
          maxLength: 255
        meta_description:
          type: string
        meta_keywords:
          type: string
      required:
      - slug
      - title
      - url
    PageTypeEnum:
      enum:
      - home
      - service
      - standard
      - legal
      type: string
      description: |-
        * `home` - Homepage
        * `service` - Service landing page
        * `standard` - Standard content page
        * `legal` - Legal / policy page
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedCancelBookingRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
    PatchedProfileUpdateRequest:
      type: object
      description: |-
        Self-service profile edit. Every field optional (PATCH); email is
        format-validated here, uniqueness is checked in the view against the row.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          maxLength: 32
    PatchedUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
    PaymentConfig:
      type: object
      properties:
        enabled:
          type: boolean
        publishable_key:
          type: string
          description: Safe to embed in the page. Empty when disabled.
        mode:
          type: string
          nullable: true
          description: '"test" or "live".'
      required:
      - enabled
      - mode
      - publishable_key
    PaymentIntentRequestRequest:
      type: object
      properties:
        reference:
          type: string
          minLength: 1
          description: Booking reference.
      required:
      - reference
    PaymentIntentResponse:
      type: object
      properties:
        client_secret:
          type: string
          description: Pass to Stripe Elements.
        publishable_key:
          type: string
        amount:
          type: string
        currency:
          type: string
        reference:
          type: string
      required:
      - amount
      - client_secret
      - currency
      - publishable_key
      - reference
    QuoteLine:
      type: object
      description: One component of a fare.
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        label:
          type: string
          description: e.g. "19 mi in 6–50 mi × $2.90".
        amount:
          type: string
          description: Decimal string. Money is never a float.
      required:
      - amount
      - kind
      - label
    QuoteRequestRequest:
      type: object
      description: |-
        A request for fares.

        Deliberately accepts NO distance and NO price. A transfer is described by
        its two addresses and the server measures it (pricing/distance.py); an
        hourly hire is described by its duration. A client-supplied distance is a
        client-supplied fare with extra steps.
      properties:
        pickup_address:
          type: string
          minLength: 1
          maxLength: 255
        dropoff_address:
          type: string
          maxLength: 255
        pickup_at:
          type: string
          format: date-time
        hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Hourly hire only. Omit for a point-to-point transfer.
        meet_and_greet:
          type: boolean
          default: false
        city_to_city:
          type: boolean
          default: false
      required:
      - pickup_address
      - pickup_at
    QuoteResponse:
      type: object
      properties:
        journey:
          allOf:
          - $ref: '#/components/schemas/Journey'
          nullable: true
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/QuoteResult'
      required:
      - journey
      - quotes
    QuoteResult:
      type: object
      description: A priced option for one vehicle.
      properties:
        vehicle_id:
          type: integer
        vehicle_name:
          type: string
        subtotal:
          type: string
        surcharge_total:
          type: string
        tax:
          type: string
        total:
          type: string
        currency:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        quote_token:
          type: string
          description: Signed and short-lived. Present this to create a booking; the
            server recomputes the fare from it.
      required:
      - currency
      - lines
      - quote_token
      - subtotal
      - surcharge_total
      - tax
      - total
      - vehicle_id
      - vehicle_name
    RegisterRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
      required:
      - email
      - password
    SavedCard:
      type: object
      description: A customer's card on file. Display bits only -- never anything
        to charge with.
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: string
          readOnly: true
        last4:
          type: string
          readOnly: true
        exp_month:
          type: integer
          readOnly: true
          nullable: true
        exp_year:
          type: integer
          readOnly: true
          nullable: true
        is_default:
          type: boolean
          readOnly: true
        label:
          type: string
          readOnly: true
        expiry:
          type: string
          readOnly: true
      required:
      - brand
      - exp_month
      - exp_year
      - expiry
      - id
      - is_default
      - label
      - last4
    SendCodeRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    SetupIntentResponse:
      type: object
      properties:
        client_secret:
          type: string
        publishable_key:
          type: string
      required:
      - client_secret
      - publishable_key
    SiteSettings:
      type: object
      description: |-
        Site-wide contact details and social links, for the header and footer.

        `ops_notification_email` is deliberately absent. It is where new-booking
        alerts land, it sits on the same model as the public address purely because
        legacy kept both on the admin user row, and publishing it would hand every
        scraper the one mailbox the business cannot afford to have flooded.
      properties:
        contact_email:
          type: string
          format: email
          readOnly: true
        contact_phone:
          type: string
          readOnly: true
        facebook:
          type: string
          format: uri
          readOnly: true
        instagram:
          type: string
          format: uri
          readOnly: true
        twitter:
          type: string
          format: uri
          readOnly: true
        linkedin:
          type: string
          format: uri
          readOnly: true
        google_maps_api_key:
          type: string
          readOnly: true
          description: Google Maps key for address autocomplete and distance pricing.
            Leave blank to use the server's configured key.
      required:
      - contact_email
      - contact_phone
      - facebook
      - google_maps_api_key
      - instagram
      - linkedin
      - twitter
    StatusEnum:
      enum:
      - pending
      - confirmed
      - completed
      - no_show
      - cancelled
      type: string
      description: |-
        * `pending` - Pending payment
        * `confirmed` - Confirmed
        * `completed` - Completed
        * `no_show` - No-show
        * `cancelled` - Cancelled
    TimeSurcharge:
      type: object
      properties:
        name:
          type: string
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        percentage:
          type: string
        crosses_midnight:
          type: boolean
      required:
      - crosses_midnight
      - end_time
      - name
      - percentage
      - start_time
    TripTypeEnum:
      enum:
      - transfer
      - hourly
      type: string
      description: |-
        * `transfer` - Point-to-point transfer
        * `hourly` - Hourly hire
    User:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
      required:
      - email
      - first_name
      - last_name
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: e.g. "Business Class".
          maxLength: 120
        slug:
          type: string
          maxLength: 140
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
        features:
          type: string
          description: Marketing copy, e.g. "Free cancellation up until 1 hour before
            pickup".
        passenger_capacity:
          type: integer
          maximum: 65535
          minimum: 0
        luggage_capacity:
          type: integer
          maximum: 65535
          minimum: 0
        minimum_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: Fare floor. Applied after every other adjustment.
        photo:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - id
      - name
      - photo
      - slug
    VerifyCodeRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 1
          description: The six-digit code from the email.
      required:
      - code
      - email
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
servers:
- url: http://localhost:8000
  description: Local development
- url: https://api.austinlimoshuttle.com
  description: Production
tags:
- name: content
  description: Pages, vehicles and availability.
- name: quotes
  description: Fare quoting. Returns signed tokens.
- name: bookings
  description: Creating and managing bookings.
- name: staff
  description: Back-office review (staff only).
- name: payments
  description: Stripe checkout and webhooks.
- name: auth
  description: Sign in, register, password reset.
- name: enquiries
  description: Contact form.
