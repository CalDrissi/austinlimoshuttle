[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py tests.py
addopts =
    --strict-markers
    --disable-warnings
    -ra
    --ds=config.settings.test
testpaths =
    accounts
    config
    fleet
    pricing
    bookings
    payments
    content
    enquiries
    dashboard
    driver
    api
    notifications
    legacy_import
markers =
    legacy: requires the sanitised legacy replica to be loaded
